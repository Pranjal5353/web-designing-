<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cart</title>
    <style>
        .cart {
        width: 80%;
        margin: 20px auto;
        padding: 20px;
        border: 2px solid #000; 
        }    
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }    
        input[type="number"] {
            width: 50px;
            padding: 4px;
        }
        .cart_total {
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cart_total button {
            padding: 8px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="cart">
        <h2>Your's Shopping Cart</h2>
        <div class="cart_box">
            <table>
                <tr>
                    <th>Book Name</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Total</th>
                </tr>
                <tr>
                    <td>Foundation of Computer Science</td>
                    <td>980.00</td>
                    <td><input type="number" value="1" min="1"></td>
                    <td>980.00</td>
                </tr>
                <tr>
                    <td>Fundamentals of structure</td>
                    <td>650.00</td>
                    <td><input type="number" value="1" min="1"></td>
                    <td>650.00</td>
                </tr>
                <!-- Add more rows for additional books in the cart -->
            </table>
            <div class="cart_total">
                <h3>Total: 1630.00</h3>
                <button>Proceed to Checkout</button>
            </div>
        </div>
    </div>

    
</body>
</html>
