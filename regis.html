<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register new User</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="regis_main_box">
        <h1>Register here</h1>
        <div class="logo_box">
            <img src="glbajajlogo.jpg" alt="logo" class="login_logo">
        </div>
        <form>
            
            <label for="username">Create Username:</label>
            <input type="text" id="username" name="username" required>
            <br><br>
            <label for="email">Enter  Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>
            <label for="address">Enter Address:</label>
            <input type="text" id="address" name="address" required>
            <br><br>
            <label for="number">Enter Mobile Number:</label>
            <input type="number" id="number" name="number" required>
            <br><br>
            <label for="password">Create Password:</label>
            <input type="password" id="password" name="password" required>
            <br><br>
            <label>
            <input type="checkbox" name="option1" value="A">Agree to Terms and Conditions</label><br>
            <button type="button" onclick="window.location.href='login.html'">Already register? Login</button>
            <input type="submit" value="Login">
        </form>
    </div>
</body>
</html>
